<script>
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const CA_PUBKEY_B64 = "BO+1Mjj2ZeglAd76ArgCaujE0FdBr+TURI6nlaMaAYAN7pZN04F3yhqzxGhDalco5cGMqSdVtgUT9Tu4iFbG9Q0=";
// 测试网：bc1 改成 tb1 网络。这里默认 bitcoin mainnet，可切换。
let NETWORK = "bitcoin";

let device, server, rxChar, txChar, rxBuf = "", pendingAsk = null;
let trusted = false, authed = false, timer = null;

const logEl = document.getElementById("log");
function log(msg, cls="") {
  const t = new Date().toLocaleTimeString("zh-CN");
  logEl.innerHTML += `<div class="${cls}"><span class="tag">[${t}]</span> ${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(t, on) {
  document.getElementById("statusText").textContent = t;
  document.getElementById("dot").className = "dot" + (on ? " on" : "");
}
function b64ToBytes(b64) { const b = atob(b64); const a = new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function bytesToB64(b) { let s=""; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); }
function bytesToHexW(b) { return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join(""); }
function hexToBytes(hex) { hex=hex.trim().replace(/^0x/,""); const a=new Uint8Array(hex.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(hex.substr(i*2,2),16); return a; }

function onNotify(ev) {
  rxBuf += new TextDecoder().decode(ev.target.value);
  let idx;
  while ((idx = rxBuf.indexOf("\n")) >= 0) {
    const line = rxBuf.slice(0, idx); rxBuf = rxBuf.slice(idx+1);
    if (line.length) handleReply(line);
  }
}

function handleReply(line) {
  if (pendingAsk) {
    const hit = line.includes(pendingAsk.keyPrefix) || line.startsWith("OK ") || line.startsWith("ERR");
    if (hit) {
      const p = pendingAsk; pendingAsk = null; clearTimeout(p.timer);
      p.resolve(line.startsWith("ERR") ? null : { raw: line });
    }
  }
  if (line.startsWith("OK")) log("← " + line, "ok");
  else if (line.startsWith("ERR")) log("← " + line, "err");
  else log("← " + line);
}

async function send(cmd, logFilter) {
  if (!rxChar) return;
  log("→ " + (logFilter || cmd));
  const full = cmd.endsWith("\n") ? cmd : cmd + "\n";
  const data = new TextEncoder().encode(full);
  const CHUNK = 20; let i = 0;
  while (i < data.length) {
    let end = Math.min(i + CHUNK, data.length);
    while (end > i && end < data.length && (data[end] & 0xC0) === 0x80) end--;
    const chunk = data.slice(i, end);
    try { await rxChar.writeValueWithResponse(chunk); } catch(e) { await rxChar.writeValue(chunk); }
    i = end;
  }
}
function ask(cmd, keyPrefix, timeoutMs, logFilter) {
  return new Promise((resolve) => {
    const t = setTimeout(() => { pendingAsk = null; resolve(null); }, timeoutMs || 3000);
    pendingAsk = { resolve, keyPrefix, timer: t };
    send(cmd, logFilter);
  });
}

function gate() {
  const ok = trusted && authed;
  ["btnImportPriv","btnListWallet"].forEach(id => { const e=document.getElementById(id); if(e) e.disabled=!ok; });
  document.getElementById("txCard").classList.toggle("hidden", !ok);
}

document.getElementById("btnConnect").onclick = async () => {
  if (!navigator.bluetooth) { alert("需用 Chrome/Edge（支持 Web Bluetooth）"); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ filters:[{namePrefix:"ATRI"}], optionalServices:[SVC] });
    device.addEventListener("gattserverdisconnected", () => { setStatus("已断开", false); trusted=authed=false; gate(); });
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    rxChar = await svc.getCharacteristic(RX);
    txChar = await svc.getCharacteristic(TX);
    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onNotify);
    setStatus("已连接 " + device.name, true);
    log("✅ 已连接，验证设备身份...", "ok");
    await verifyDevice();
  } catch(e) { log("❌ 连接失败: " + e.message, "err"); }
};

async function verifyDevice() {
  try {
    const certReply = await ask("GETCERT", "CERT:", 3000);
    if (!certReply) { setStatus("设备无证书", false); return; }
    const certB64 = certReply.raw.split("CERT:")[1].trim();
    const cert = b64ToBytes(certB64);
    const plen = (cert[0]<<8)|cert[1];
    const payload = cert.slice(2, 2+plen);
    const slen = (cert[2+plen]<<8)|cert[2+plen+1];
    const sig = cert.slice(4+plen, 4+plen+slen);
    const devicePub = payload.slice(1, 66);
    const caPub = await crypto.subtle.importKey("raw", b64ToBytes(CA_PUBKEY_B64).slice(0,65),
      { name:"ECDSA", namedCurve:"P-256" }, false, ["verify"]);
    const okCert = await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"}, caPub, sig, payload);
    if (!okCert) { setStatus("⚠️ 证书验签失败", false); log("❌ 证书验签失败！拒绝连接", "err"); return; }
    const nonce = crypto.getRandomValues(new Uint8Array(32));
    const authReply = await ask("AUTH " + bytesToB64(nonce), "SIG:", 3000);
    if (!authReply) { setStatus("挑战无响应", false); return; }
    const devKey = await crypto.subtle.importKey("raw", devicePub, {name:"ECDSA",namedCurve:"P-256"}, false, ["verify"]);
    const okAuth = await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"}, devKey,
      b64ToBytes(authReply.raw.split("SIG:")[1].trim()), nonce.buffer);
    if (!okAuth) { setStatus("⚠️ 挑战响应失败", false); return; }
    trusted = true;
    setStatus("🔒 设备已验证", true);
    log("🔒 设备身份验证通过", "ok");
    document.getElementById("passArea").classList.remove("hidden");
    const has = await ask("HASPASS", "pass ", 2000);
    document.getElementById("btnUnlock").textContent = (has && /pass set/.test(has.raw)) ? "🔓 解锁" : "🔐 设置密码";
    gate();
  } catch(e) { log("❌ 验证异常: " + e.message, "err"); }
}

document.getElementById("btnUnlock").onclick = async () => {
  const pw = document.getElementById("inPass").value;
  if (!pw) { alert("请输入密码"); return; }
  const has = document.getElementById("btnUnlock").textContent.includes("解锁");
  let r;
  if (has) r = await ask("AUTHPASS " + pw, "auth ok", 3000);
  else r = await ask("SETPASS " + pw, "pass set", 3000);
  if (r) {
    authed = true;
    document.getElementById("inPass").value = "";
    log("✅ 已解锁", "ok");
    gate();
  } else { alert("密码错误/设置失败"); log("❌ 解锁失败", "err"); }
};

// --- 助记词派生（自实现 BIP39 种子 + bitcoinjs BIP32，无需 bip39 库） ---
// BIP39 种子 = PBKDF2-HMAC-SHA512(密码=助记词, 盐="mnemonic"+passphrase, 2048轮, 64字节)
async function mnemonicToSeed(mnemonic, passphrase = "") {
  const enc = new TextEncoder();
  const mn = mnemonic.normalize("NFKD");
  const key = await crypto.subtle.importKey("raw", enc.encode(mn), "PBKDF2", false, ["deriveBits"]);
  const salt = enc.encode("mnemonic" + (passphrase || "").normalize("NFKD"));
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: 2048, hash: "SHA-512" }, key, 512);
  return new Uint8Array(bits);
}

document.getElementById("btnDerive").onclick = async () => {
  const mn = document.getElementById("wMnemonic").value.trim().replace(/\s+/g, " ");
  const path = document.getElementById("wPath").value.trim();
  if (!mn) { alert("请输入助记词"); return; }
  try {
    if (typeof bitcoinjsLib === "undefined") throw new Error("bitcoinjs 库未加载（需联网）");
    if (typeof HDKey === "undefined") throw new Error("HDKey 库未加载（需联网）");
    const words = mn.split(" ");
    if (![12,15,18,21,24].includes(words.length)) throw new Error(`助记词应为 12/15/18/21/24 词，当前 ${words.length} 词`);
    const seed = await mnemonicToSeed(mn);

    console.log('Seed length:', seed.length);
    console.log('First 16 bytes:', Array.from(seed.slice(0, 16)).map(b => b.toString(16).padStart(2,'0')).join(''));

    // 使用 scure-bip32（纯 JavaScript，无需 Buffer）
    const root = HDKey.fromMasterSeed(seed);
    const child = root.derive(path);

    if (!child.privateKey) throw new Error("无法派生私钥（路径错误？）");

    const priv = child.privateKey;
    const hex = Array.from(priv).map(b => b.toString(16).padStart(2, '0')).join('');
    document.getElementById("wPriv").value = hex;

    const { address } = bitcoinjsLib.payments.p2wpkh({ pubkey: child.publicKey, network: bitcoinjsLib.networks[NETWORK] });
    document.getElementById("deriveInfo").innerHTML =
      `✓ 已派生（路径 ${path}）<div class="addr">地址: ${address}</div>`;
    log("🌿 已派生子私钥 + 地址（本地，未上传）", "ok");
    document.getElementById("wMnemonic").value = "";
  } catch(e) { alert("派生失败: " + e.message); console.error(e); }
};

document.getElementById("btnImportPriv").onclick = async () => {
  const label = document.getElementById("wLabel").value.trim();
  const hex = document.getElementById("wPriv").value.trim().replace(/\s/g,"");
  if (!label || !hex) { alert("请填标签和私钥 hex"); return; }
  if (!/^[0-9a-fA-F]{64}$/.test(hex)) { alert("私钥需 64 位 hex"); return; }
  if (!confirm("⚠️ 将私钥导入设备（只进不出，永不导出）。继续？")) return;
  const r = await ask(`IMPORTPRIV ${label} ${hex}`, "imported", 4000);
  if (r) { log("✅ 私钥已导入设备（不可导出）", "ok"); document.getElementById("wPriv").value=""; listWallet(); }
  else log("❌ 导入失败", "err");
};

document.getElementById("btnListWallet").onclick = () => listWallet();
async function listWallet() {
  const r = await ask("LISTWALLET", "keys:", 3000);
  const box = document.getElementById("walletBox");
  if (!r) { box.innerHTML = '<div class="sub">无密钥或未解锁</div>'; return; }
  const m = r.raw.match(/keys:\s*([\s\S]*)/);
  const names = (m ? m[1] : "").split(";").map(s=>s.trim()).filter(Boolean);
  if (!names.length) { box.innerHTML = '<div class="sub">（空）</div>'; return; }
  box.innerHTML = names.map(n => `
    <div class="entry"><span class="name">${n}</span>
      <button class="ghost" data-wpub="${n}" style="width:auto;margin:0;padding:6px 10px">公钥</button>
      <button class="del" data-wdel="${n}">🗑️</button></div>`).join("");
  box.querySelectorAll("button[data-wdel]").forEach(b => b.onclick = async () => {
    if (confirm(`删除 ${b.dataset.wdel}？`)) { await ask("DELWALLET " + b.dataset.wdel, "deleted", 3000); listWallet(); }
  });
  box.querySelectorAll("button[data-wpub]").forEach(b => b.onclick = async () => {
    const rr = await ask("GETWALLETPUB " + b.dataset.wpub, "PUBKEY", 3000);
    if (rr) alert(`公钥(${b.dataset.wpub}):\n${rr.raw.split("PUBKEY:")[1].trim()}`);
  });
}

// --- 构造单输入 P2WPKH 交易，请求设备签名 ---
document.getElementById("btnBuildTx").onclick = async () => {
  try {
    if (typeof bitcoinjsLib === "undefined") throw new Error("bitcoinjs 库未加载");
    if (typeof Secp256k1 !== "undefined") bitcoinjsLib.initEccLib(Secp256k1);
    const to = document.getElementById("txTo").value.trim();
    const amount = parseInt(document.getElementById("txAmount").value);
    const utxoStr = document.getElementById("txUtxo").value.trim();
    const changeAddr = document.getElementById("txChange").value.trim();
    const feeRate = parseInt(document.getElementById("txFee").value) || 10;
    if (!to || !amount || !utxoStr) { alert("请填收款地址、金额、UTXO"); return; }
    const [txid, voutStr, valStr, label] = utxoStr.split(":");
    const vout = parseInt(voutStr), value = parseInt(valStr);
    if (!label) { alert("UTXO 格式应为 txid:vout:value:密钥标签"); return; }

    const net = bitcoinjsLib.networks[NETWORK];
    // 取设备里对应标签的公钥，算 scriptPubKey
    const pkr = await ask("GETWALLETPUB " + label, "PUBKEY", 3000);
    if (!pkr) { alert("取公钥失败（未解锁？标签对吗）"); return; }
    const pubHost = pkr.raw.split("PUBKEY:")[1].trim();
    const pubBuf = Buffer.from(pubHost, "base64"); // 33B compressed
    const p2wpkh = bitcoinjsLib.payments.p2wpkh({ pubkey: pubBuf, network: net });

    const psbt = new bitcoinjsLib.Psbt({ network: net });
    psbt.addInput({
      hash: txid, index: vout,
      witnessUtxo: { script: p2wpkh.output, value: value },
    });
    psbt.addOutput({ address: to, value: amount });
    let changeValue = value - amount - Math.ceil(feeRate * 110); // 粗略估算手续费
    if (changeAddr && changeValue > 546) {
      psbt.addOutput({ address: changeAddr, value: changeValue });
    }

    // 计算 sighash（input 0），发给设备签名
    const signer = { publicKey: pubBuf, sign: () => { throw new Error("no"); } };
    const sigHash = psbt.getHashForSig(0, null, signer); // Buffer
    log("→ SIGNHASH " + label + " <hash>");
    const sr = await ask(`SIGNHASH ${label} ${Buffer.from(sigHash).toString("base64")}`, "SIG:", 4000);
    if (!sr) { alert("设备签名失败"); return; }
    const rawSig = Buffer.from(sr.raw.split("SIG:")[1].trim(), "base64"); // 64B r||s

    // 转 DER
    const r = rawSig.slice(0,32), s = rawSig.slice(32,64);
    const derSig = bitcoinjsLib.script.signature.encode(
      { r: BigInt("0x"+r.toString("hex")), s: BigInt("0x"+s.toString("hex")) }, 0x01);
    psbt.updateInput(0, { partialSig: [{ pubkey: pubBuf, signature: derSig }] });
    psbt.finalizeAllInputs();
    const rawTx = psbt.extractTransaction().toHex();
    document.getElementById("txRaw").value = rawTx;
    document.getElementById("txInfo").textContent = "✓ 已签名，可广播";
    log("✅ 交易已签名（原始 hex 已生成）", "ok");
  } catch(e) { alert("构造失败: " + e.message); log("❌ " + e.message, "err"); }
};

document.getElementById("btnBroadcast").onclick = async () => {
  const raw = document.getElementById("txRaw").value.trim();
  if (!raw) { alert("先构造并签名交易"); return; }
  const url = NETWORK === "bitcoin"
    ? "https://mempool.space/api/tx"
    : "https://mempool.space/testnet/api/tx";
  try {
    log("📡 广播中...");
    const res = await fetch(url, { method:"POST", body: raw });
    const txt = await res.text();
    if (res.ok) { document.getElementById("txInfo").textContent = "TXID: " + txt; log("✅ 广播成功: " + txt, "ok"); }
    else { document.getElementById("txInfo").textContent = "失败: " + txt; log("❌ 广播失败: " + txt, "err"); }
  } catch(e) { log("❌ 广播异常: " + e.message, "err"); }
};
</script>
